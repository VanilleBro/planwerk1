<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planwerk 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: #1a1a1a;
        }

        .btn {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn:hover {
            background-color: #0051a2;
        }

        .btn-danger {
            background-color: #e53e3e;
        }

        .btn-danger:hover {
            background-color: #c53030;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Overlay Modal */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal h2 {
            margin-bottom: 15px;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
        }

        .error-message {
            color: #e53e3e;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .timetable-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .timetable-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div id="authOverlay" class="overlay" style="display: none;">
        <div class="modal">
            <h2>Planwerk Lizenz</h2>
            <p style="margin-bottom: 15px; font-size: 0.9rem; color: #666;">
                Bitte gebe deinen Lizenzschlüssel ein. Dieser wird fest an dieses Gerät gebunden.
            </p>
            <form onsubmit="submitAccessKey(event)">
                <input type="text" id="accessKeyInput" placeholder="Z. B. PLANWERK-2026" required autocomplete="off">
                <button type="submit" class="btn" style="width: 100%;">Aktivieren</button>
            </form>
            <div id="authError" class="error-message"></div>
        </div>
    </div>

    <!-- Main Content -->
    <header>
        <h1>Planwerk 1</h1>
        <button id="logoutBtn" class="btn btn-danger" style="display: none;" onclick="logout()">Abmelden</button>
    </header>

    <div class="container">
        <h2>Dein Stundenplan</h2>
        <div id="timetableContainer" style="margin-top: 15px;">
            Lade Stundenplan...
        </div>
    </div>

    <script>
        // Generate or fetch permanent browser/device UUID
        function getDeviceId() {
            let deviceId = localStorage.getItem('planwerk_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
                localStorage.setItem('planwerk_device_id', deviceId);
            }
            return deviceId;
        }

        async function checkAuthStatus() {
            try {
                const res = await fetch('/api/auth-status');
                const data = await res.json();

                if (data.authenticated) {
                    document.getElementById('authOverlay').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'block';
                    loadTimetable();
                } else {
                    document.getElementById('authOverlay').style.display = 'flex';
                    document.getElementById('logoutBtn').style.display = 'none';
                }
            } catch (err) {
                console.error('Fehler bei der Authentifizierungsprüfung:', err);
            }
        }

        async function submitAccessKey(e) {
            e.preventDefault();
            const key = document.getElementById('accessKeyInput').value.trim();
            const errorEl = document.getElementById('authError');
            errorEl.style.display = 'none';

            try {
                const response = await fetch('/api/verify-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        key: key, 
                        deviceId: getDeviceId() 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('authOverlay').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'block';
                    loadTimetable();
                } else {
                    errorEl.textContent = data.error || 'Ungültiger Lizenzschlüssel!';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Verbindungsfehler zum Server.';
                errorEl.style.display = 'block';
            }
        }

        async function loadTimetable() {
            const container = document.getElementById('timetableContainer');
            container.innerHTML = 'Lade aktuellen Stundenplan...';

            try {
                const res = await fetch('/api/timetable');
                const data = await res.json();

                if (res.ok && data.timetable) {
                    if (data.timetable.length === 0) {
                        container.innerHTML = '<p>Keine Unterrichtsstunden für heute gefunden.</p>';
                        return;
                    }

                    container.innerHTML = data.timetable.map(lesson => `
                        <div class="timetable-item">
                            <span><strong>${lesson.su ? lesson.su[0].name : 'Unterricht'}</strong></span>
                            <span>${lesson.kl ? lesson.kl[0].name : ''} (${lesson.ro ? lesson.ro[0].name : 'Raum k.A.'})</span>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<p style="color:red;">${data.error || 'Fehler beim Abrufen des Stundenplans.'}</p>`;
                }
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Netzwerkfehler beim Laden des Stundenplans.</p>';
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                location.reload();
            } catch (err) {
                alert('Fehler beim Abmelden.');
            }
        }

        // Initialize application check
        checkAuthStatus();
    </script>
</body>
</html>
